apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-sa
  namespace: secure-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: secure-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: secure-demo
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-pod-reader
  namespace: secure-demo
subjects:
- kind: ServiceAccount
  name: dev-sa
  namespace: secure-demo
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-binding
  namespace: secure-demo
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: secure-demo
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
