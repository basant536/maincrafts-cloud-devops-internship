deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cloud-deployment-hub:latest
            sudo docker stop app || true
            sudo docker rm app || true
            sudo docker run -d --name app -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/cloud-deployment-hub:latest